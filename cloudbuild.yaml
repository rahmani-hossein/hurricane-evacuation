steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg
      - VITE_GOOGLE_MAPS_API_KEY=${_VITE_GOOGLE_MAPS_API_KEY}
      - -t
      - ${_IMAGE}
      - .
images:
  - ${_IMAGE}
substitutions:
  _IMAGE: gcr.io/qwiklabs-gcp-04-9fa9c7b57012/hurricane-evacuation-command
options:
  logging: CLOUD_LOGGING_ONLY
